{% extends 'base.html' %}
{% load static %}

{% block title %}Thank You | SkillSwap{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg border-0 rounded-2xl text-center">
        <div class="card-body p-5">
          <div class="mb-4">
            <span style="font-size: 3rem;">✅</span>
          </div>
          <h2 class="card-title mb-3 text-success">Thank You!</h2>
          <p class="lead mb-4">Your message has been sent successfully. Receiver will get back to you as soon as possible.</p>
          <a href="{% url 'skill_list' %}" class="btn btn-outline-primary px-4">
            🔙 Back to Skill Listings
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
