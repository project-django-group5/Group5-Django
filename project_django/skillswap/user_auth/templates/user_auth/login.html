
{% extends 'base.html' %}
{% load static %}
{% block content %}
<h2 class="mb-4">Login</h2>

<form method="post" class="w-50 mx-auto">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div class="alert alert-danger">
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    {{ form.as_p }}

    <input type="submit" value="Log In">

</form>
{% endblock %}
