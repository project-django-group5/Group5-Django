
{% extends 'base.html' %}
{% load static %}
{% block content %}
<h2>Your Profile</h2>
  <p><strong>Username:</strong> {{ user.username }}</p>
  <p><strong>Email:</strong> {{ user.email }}</p>
  {% if user.userdetail.profile_pic %}
    <img src="{{ user.userdetail.profile_pic.url }}" alt="Profile photo" width="150" />
  {% else %}
    <p>No profile photo.</p>
  {% endif %}
{% endblock %}
